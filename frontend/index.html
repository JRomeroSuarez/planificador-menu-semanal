<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planificador de Menús</title>
    <meta name="description" content="Planifica tus menús semanales y genera la lista de la compra" />
    <meta name="theme-color" content="#FBF7F0" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />

    <style>
        @font-face {
            font-family: 'Material Symbols Outlined';
            font-style: normal;
            font-weight: 400;
            font-display: block;
            src: url('/fonts/MaterialSymbolsOutlined.ttf') format('truetype');
        }

        body {
            font-family: 'Inter', sans-serif;
        }

        @media print {
            body {
                background-color: white;
            }

            .no-print {
                display: none !important;
            }

            #printable-area {
                display: block !important;
            }

            main,
            aside {
                display: none !important;
            }

            .printable-main-content {
                display: block !important;
                padding: 0 !important;
            }
        }
    </style>
</head>

<body class="bg-background text-foreground antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
